<!doctype html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TroubleDent — тренажёр неотложной помощи в стоматологии: материалы, тесты и интерактивные симуляторы для студентов и врачей."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="TroubleDent" />
    <meta property="og:title" content="TroubleDent — тренажёр неотложной помощи в стоматологии" />
    <meta
      property="og:description"
      content="Материалы, тесты и интерактивные симуляторы неотложных состояний для студентов-стоматологов и врачей."
    />
    <meta property="og:image" content="https://trouble-dent.ru/logo.png" />
    <!-- Тема до первой отрисовки: сохранённый выбор, иначе системная (без FOUC). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <title>TroubleDent — тренажёр неотложной помощи в стоматологии</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
