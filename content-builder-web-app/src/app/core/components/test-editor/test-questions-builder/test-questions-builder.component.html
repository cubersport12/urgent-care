<div class="w-full h-full overflow-hidden flex flex-col gap-1">
  <h5>Вопросы теста</h5>
  <div class="flex gap-1 w-full justify-end">
    <app-button
      type="button"
      (clicked)="_handleCreate()"
      icon="plus"
      size="sm"
    >
      Добавить вопрос
    </app-button>
  </div>
  <div class="grow overflow-auto max-h-[calc(100vh-280px)] border border-slate-200 dark:border-slate-800 rounded-xl">
    <table mat-table [dataSource]="_questions()" class="w-full" cdkDropList (cdkDropListDropped)="_handleQuestionDrop($event)" [cdkDropListData]="_questions()">
      <ng-container matColumnDef="index">
        <th mat-header-cell *matHeaderCellDef class="!w-14">#</th>
        <td mat-cell *matCellDef="let element; let i = index">
          <div class="flex items-center gap-2">
            <mat-icon class="example-drag-cursor" svgIcon="bars"/>
            <span>
              {{i + 1}}
            </span>
          </div>
          
        </td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Наименование</th>
        <td mat-cell *matCellDef="let element">{{element.name}}</td>
      </ng-container>
      <ng-container matColumnDef="info">
        <th mat-header-cell *matHeaderCellDef>Информация</th>
        <td mat-cell *matCellDef="let element">{{_getQuestionInfoTest(element)}}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="!w-24"></th>
        <td mat-cell *matCellDef="let element">
          <div class="flex items-center justify-end gap-1">
            <app-icon-button
              icon="pen-to-square"
              variant="ghost"
              size="sm"
              tooltip="Редактировать"
              (clicked)="_handleEdit(element)"
            />
            <app-icon-button
              icon="trash"
              variant="ghost"
              size="sm"
              tooltip="Удалить"
              class="text-rose-500 hover:text-rose-600"
              (clicked)="_handleDelete(element)"
            />
          </div>
        </td>
      </ng-container>
      @let displayedColumns = ["index", "name", "info", "actions"];
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr cdkDrag [cdkDragData]="row" mat-row [ngClass]="{ '!bg-amber-500/10 dark:!bg-amber-500/15 !text-amber-900 dark:!text-amber-200 border-l-4 border-l-amber-500': row.activationCondition != null }" *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center py-6 text-slate-400" [attr.colspan]="displayedColumns.length">Нет вопросов</td>
      </tr>
    </table>
  </div>
</div>
