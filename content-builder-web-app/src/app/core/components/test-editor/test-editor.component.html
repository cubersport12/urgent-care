<app-dialog-wrapper
  [title]="_dialogData.id ? 'Редактировать тест' : 'Новый интерактивный тест'"
  [subtitle]="_dialogData.id ? (_dialogData.name || 'Настройка вопросов, проходного балла и условий доступа') : 'Создание нового тестового сценария'"
  [saveDisabled]="_form.invalid || !_form.dirty || _isPending()"
  [loading]="_isPending()"
  saveText="Сохранить"
  saveIcon="check"
  (save)="_handleSubmit()"
  (close)="_handleClose()"
>
  <form class="flex flex-col w-full gap-4 p-1 min-w-[340px]" [formGroup]="_form" (ngSubmit)="_handleSubmit()">
    <!-- Base Info Section -->
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/60 p-4 space-y-4">
      <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
        <mat-icon svgIcon="file-circle-check" class="!w-4 !h-4 text-indigo-500" />
        Параметры теста
      </div>
      <div class="flex flex-wrap gap-4 w-full items-start">
        <app-input
          label="Наименование"
          [formControl]="_form.controls.name"
          placeholder="Например: Основы реанимации"
          [required]="true"
          class="grow min-w-[240px]"
        />
        <app-input
          label="Макс. количество ошибок"
          type="number"
          [formControl]="_form.controls.maxErrors"
          class="w-48"
        />
        <div class="flex items-end gap-2 w-64">
          <app-input
            label="Проходной балл"
            type="number"
            [formControl]="_form.controls.minScore"
            class="grow"
            [error]="_scoreValidation().type === 'error' ? _scoreValidation().message : undefined"
            [hint]="_scoreValidation().type === 'warning' ? _scoreValidation().message : undefined"
          />
          <app-icon-button
            icon="calculator"
            variant="outline"
            (clicked)="_calculateMinScore()"
            [tooltip]="'Автоматически посчитать проходной балл (макс: ' + _totalCorrectScore() + ')'"
            class="mb-0.5"
          />
        </div>
      </div>

      <!-- Flags -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 w-full pt-1">
        <app-checkbox [formControl]="_form.controls.showCorrectAnswer" label="Показывать правильный ответ в вопросах" />
        <app-checkbox [formControl]="_form.controls.includeToStatistics" label="Тест участвует в статистике" />
        <app-checkbox [formControl]="_form.controls.showSkipButton" label="Показывать кнопку пропускать" />
        <app-checkbox [formControl]="_form.controls.showNavigation" label="Показывать навигацию" />
        <app-checkbox [formControl]="_form.controls.showBackButton" label="Показывать кнопку назад" />
        <app-checkbox [formControl]="_form.controls.hidden" label="Скрытый" />
        <app-checkbox [formControl]="_form.controls.randomizeQuestions" label="Случайный порядок вопросов" />
        <app-checkbox [formControl]="_form.controls.resetStatistics" label="Сбрасывать статистику при провале" />
      </div>

      @if (_form.controls.randomizeQuestions.value) {
        <app-input
          label="Показывать вопросов"
          type="number"
          [min]="1"
          [formControl]="_form.controls.questionsToShow"
          hint="Пусто = все из пула"
          class="w-64"
        />
      }

      @if (_form.controls.resetStatistics.value) {
        <app-select
          label="Сбрасываемые тесты (зачёты)"
          formControlName="resetStatisticsTestIds"
          [multiple]="true"
          [options]="_resetCandidatesOptions()"
          hint="При провале этого теста выбранные тесты станут «не сданы»"
        />
      }
    </div>

    <!-- Monetization & Rewards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <app-tariff-select [control]="_form.controls.requiredTariffId" />
      <app-reward-select [control]="_form.controls.requiredRewardId" />
    </div>

    <!-- Conditions Builder -->
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
      <app-test-conditions-builder [folderId]="_dialogData.parentId!" [formControl]="_form.controls.conditions" />
    </div>

    <!-- Questions Builder -->
    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
      <app-test-questions-builder [folderId]="_dialogData.parentId!" [formControl]="_form.controls.questions" />
    </div>
  </form>
</app-dialog-wrapper>
