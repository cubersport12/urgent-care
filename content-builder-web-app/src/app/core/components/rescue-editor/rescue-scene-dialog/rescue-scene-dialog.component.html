<app-dialog-wrapper
  [title]="_dialogData.scene ? 'Редактировать сцену' : 'Новая сцена'"
  [saveText]="_dialogData.scene ? 'Сохранить' : 'Добавить'"
  [saveDisabled]="_form.invalid"
  (save)="_submit()"
  (close)="_cancel()"
>
  <div class="flex flex-col gap-4 min-w-[360px] max-h-[80vh] overflow-auto pt-1">
    <form [formGroup]="_form" class="flex flex-col gap-4">
      <div class="flex items-center gap-2">
        <app-input
          label="Фон (изображение или URL)"
          formControlName="background"
          [readonly]="true"
          class="flex-1"
        />
        <app-button
          variant="outline"
          icon="file-contract"
          (click)="_openFile()"
          class="mt-5 shrink-0"
        >
          Выбрать
        </app-button>
      </div>

      <app-textarea
        label="Текст сцены"
        formControlName="text"
        [rows]="4"
      />

      <div class="flex flex-col gap-2">
        <app-checkbox
          label="Скрытая сцена"
          formControlName="hidden"
        />
        <app-checkbox
          label="Сцена проверена (без ошибок)"
          formControlName="isReviewed"
        />
      </div>
    </form>

    <section class="border border-slate-200 dark:border-slate-800 rounded-xl p-3 flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <span class="font-medium text-slate-700 dark:text-slate-300">Варианты выбора</span>
        <app-button
          variant="secondary"
          size="sm"
          icon="plus"
          (click)="_addChoice()"
        >
          Создать
        </app-button>
      </div>
      <div class="overflow-auto border border-slate-200 dark:border-slate-800 rounded-lg">
        <table mat-table [dataSource]="_choicesList()" class="w-full">
          <ng-container matColumnDef="text">
            <th mat-header-cell *matHeaderCellDef>Текст выбора</th>
            <td mat-cell *matCellDef="let row">{{ row.text }}</td>
          </ng-container>
          <ng-container matColumnDef="nextScene">
            <th mat-header-cell *matHeaderCellDef>Следующая сцена</th>
            <td mat-cell *matCellDef="let row">{{ _getSceneNameById(row.nextSceneId) }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row; let ci = index">
              <div class="flex gap-1 justify-end">
                <app-icon-button
                  icon="pen-to-square"
                  variant="ghost"
                  size="sm"
                  (click)="_editChoice(ci)"
                  tooltip="Редактировать"
                />
                <app-icon-button
                  icon="trash"
                  variant="ghost"
                  size="sm"
                  (click)="_removeChoice(ci)"
                  tooltip="Удалить"
                  class="text-rose-500 hover:text-rose-600"
                />
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="_choicesDisplayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: _choicesDisplayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center py-4 text-slate-400" [attr.colspan]="_choicesDisplayedColumns.length">Нет вариантов выбора</td>
          </tr>
        </table>
      </div>
    </section>

    <section class="border border-slate-200 dark:border-slate-800 rounded-xl p-3 flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <span class="font-medium text-slate-700 dark:text-slate-300">Документы</span>
        <app-button
          variant="secondary"
          size="sm"
          icon="plus"
          (click)="_addDocument()"
        >
          Создать
        </app-button>
      </div>
      <div class="overflow-auto border border-slate-200 dark:border-slate-800 rounded-lg">
        <table mat-table [dataSource]="_documentsList()" class="w-full">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Название</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>
          <ng-container matColumnDef="article">
            <th mat-header-cell *matHeaderCellDef>Документ из базы</th>
            <td mat-cell *matCellDef="let row">{{ _getArticleNameById(row.articleId) }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row; let di = index">
              <div class="flex gap-1 justify-end">
                <app-icon-button
                  icon="pen-to-square"
                  variant="ghost"
                  size="sm"
                  (click)="_editDocument(di)"
                  tooltip="Редактировать"
                />
                <app-icon-button
                  icon="trash"
                  variant="ghost"
                  size="sm"
                  (click)="_removeDocument(di)"
                  tooltip="Удалить"
                  class="text-rose-500 hover:text-rose-600"
                />
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="_documentsDisplayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: _documentsDisplayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center py-4 text-slate-400" [attr.colspan]="_documentsDisplayedColumns.length">Нет документов</td>
          </tr>
        </table>
      </div>
    </section>
  </div>
</app-dialog-wrapper>
