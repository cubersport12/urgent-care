@if (condition() === null) {
  <div class="flex flex-col gap-2 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/20">
    <span class="text-sm text-slate-500 dark:text-slate-400">Условие не задано</span>
    <div class="flex flex-wrap gap-2">
      <app-button variant="outline" size="sm" (click)="_setCompareRoot()">
        Сравнение параметра
      </app-button>
      <app-button variant="outline" size="sm" (click)="_setGroupRoot()">
        Группа (И / ИЛИ)
      </app-button>
    </div>
  </div>
} @else {
  @let c = condition()!;
  @if (c.type === 'compare') {
    <div class="flex flex-col gap-3 border border-slate-200 dark:border-slate-800 rounded-xl p-3">
      <div class="flex flex-wrap gap-2 items-center justify-between">
        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Сравнение</span>
        <app-button variant="ghost" size="sm" class="text-rose-500 hover:text-rose-600" (click)="_clear()">Удалить</app-button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <app-select
          label="Параметр"
          [ngModel]="c.parameterId"
          (ngModelChange)="_patchCompare({ parameterId: $event })"
          [options]="_paramSelectOptions()"
        />
        <app-select
          label="Условие"
          [ngModel]="c.operator"
          (ngModelChange)="_patchCompare({ operator: $event })"
          [options]="_operatorOptions"
        />
        <app-input
          label="Значение"
          type="number"
          [ngModel]="c.value"
          (ngModelChange)="_patchCompare({ value: +$event || 0 })"
        />
      </div>
    </div>
  } @else {
    <div class="flex flex-col gap-3 border border-slate-200 dark:border-slate-800 rounded-xl p-3">
      <div class="flex flex-wrap gap-2 items-center justify-between">
        <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Группа условий</span>
        <app-button variant="ghost" size="sm" class="text-rose-500 hover:text-rose-600" (click)="_clear()">Удалить группу</app-button>
      </div>
      <div class="max-w-xs">
        <app-select
          label="Объединение"
          [ngModel]="c.logicalOperator"
          (ngModelChange)="_patchGroupOp($event)"
          [options]="_logicalOpOptions"
        />
      </div>
      <div class="flex flex-col gap-3 pl-2 border-l-2 border-slate-300 dark:border-slate-700">
        @for (child of c.conditions; track $index) {
          <div class="flex gap-2 items-start w-full">
            <app-rescue-completion-condition-editor
              class="grow min-w-0"
              [condition]="child"
              (conditionChange)="_updateChild($index, $event)"
              [parameterOptions]="parameterOptions()" />
          </div>
        }
      </div>
      <div class="flex flex-wrap gap-2">
        <app-button variant="outline" size="sm" icon="plus" (click)="_addCompareChild()">
          Сравнение
        </app-button>
        <app-button variant="outline" size="sm" icon="plus" (click)="_addGroupChild()">
          Вложенная группа
        </app-button>
      </div>
    </div>
  }
}
