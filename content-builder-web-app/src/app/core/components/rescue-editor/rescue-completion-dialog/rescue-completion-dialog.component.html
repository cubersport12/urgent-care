<app-dialog-wrapper
  title="Условия завершения спасения"
  subtitle="Задайте деревья условий по параметрам таймера"
  saveText="Сохранить"
  (save)="_submit()"
  (close)="_cancel()"
>
  <div class="flex flex-col gap-4 max-h-[min(80vh,680px)] overflow-auto min-w-[min(100%,480px)] pt-1">
    <div class="flex items-center justify-between">
      <p class="text-xs text-slate-500 dark:text-slate-400 m-0">
        Используйте группы «И» / «ИЛИ» для объединения сравнений.
      </p>
      <app-button
        variant="ghost"
        size="sm"
        (click)="_clearAll()"
        class="text-rose-500 hover:text-rose-600 shrink-0"
      >
        Сбросить всё
      </app-button>
    </div>

    <section class="flex flex-col gap-2">
      <h3 class="text-sm font-semibold text-emerald-600 dark:text-emerald-400 m-0">Успешное завершение</h3>
      <app-rescue-completion-condition-editor
        [condition]="_success()"
        (conditionChange)="_onSuccessChange($event)"
        [parameterOptions]="_parameterOptions()" />
    </section>

    <mat-divider />

    <section class="flex flex-col gap-2">
      <h3 class="text-sm font-semibold text-rose-600 dark:text-rose-400 m-0">Неуспешное завершение</h3>
      <app-rescue-completion-condition-editor
        [condition]="_failure()"
        (conditionChange)="_onFailureChange($event)"
        [parameterOptions]="_parameterOptions()" />
    </section>

    @if (_error(); as err) {
      <p class="text-xs text-rose-600 dark:text-rose-400 m-0 p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20">{{ err }}</p>
    }
  </div>
</app-dialog-wrapper>
