<app-dialog-wrapper
  [title]="_dialogData.parameter ? 'Редактировать параметр' : 'Новый параметр'"
  [saveText]="_dialogData.parameter ? 'Сохранить' : 'Добавить'"
  [saveDisabled]="_form.invalid"
  (save)="_submit()"
  (close)="_cancel()"
>
  <div class="flex flex-col gap-4 min-w-[360px] max-h-[80vh] overflow-auto pt-1">
    <form [formGroup]="_form" class="flex flex-col gap-4">
      <app-input
        label="Наименование"
        formControlName="name"
      />

      <app-textarea
        label="Описание"
        formControlName="description"
        [rows]="2"
        hint="Необязательно; показывается в мобильном приложении под параметром"
      />

      <app-select
        label="Тип параметра"
        formControlName="type"
        [options]="_typeOptions"
      />

      <app-checkbox
        label="Скрыть параметр"
        formControlName="isHidden"
      />

      @if (_isTimerType()) {
        <app-input
          type="time"
          step="1"
          label="Стартовое время"
          formControlName="timerTime"
          hint="Сохраняется как секунды в поле startValue"
        />
      } @else {
        <div class="grid grid-cols-2 gap-3">
          <app-input
            type="number"
            label="Изменять на"
            formControlName="delta"
          />
          <app-input
            type="number"
            label="Стартовое значение"
            formControlName="startValue"
          />
        </div>
      }
    </form>

    <section class="border border-slate-200 dark:border-slate-800 rounded-xl p-3 flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <span class="font-medium text-slate-700 dark:text-slate-300">Уровни серьёзности</span>
        <app-button
          variant="secondary"
          size="sm"
          icon="plus"
          (click)="_addSeverity()"
        >
          Создать
        </app-button>
      </div>
      <div class="overflow-auto border border-slate-200 dark:border-slate-800 rounded-lg">
        <table mat-table [dataSource]="_severitiesList()" class="w-full">
          <ng-container matColumnDef="min">
            <th mat-header-cell *matHeaderCellDef>Мин.</th>
            <td mat-cell *matCellDef="let row">{{ _formatNumber(row.min) }}</td>
          </ng-container>
          <ng-container matColumnDef="max">
            <th mat-header-cell *matHeaderCellDef>Макс.</th>
            <td mat-cell *matCellDef="let row">{{ _formatNumber(row.max) }}</td>
          </ng-container>
          <ng-container matColumnDef="severity">
            <th mat-header-cell *matHeaderCellDef>Серьёзность</th>
            <td mat-cell *matCellDef="let row">{{ _severityLabel(row.severity) }}</td>
          </ng-container>
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Описание</th>
            <td mat-cell *matCellDef="let row" [title]="row.description ?? ''">{{ _formatDescription(row) }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row; let si = index">
              <div class="flex gap-1 justify-end">
                <app-icon-button
                  icon="pen-to-square"
                  variant="ghost"
                  size="sm"
                  (click)="_editSeverity(si)"
                  tooltip="Редактировать"
                />
                <app-icon-button
                  icon="trash"
                  variant="ghost"
                  size="sm"
                  (click)="_removeSeverity(si)"
                  tooltip="Удалить"
                  class="text-rose-500 hover:text-rose-600"
                />
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="_severitiesDisplayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: _severitiesDisplayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center py-4 text-slate-400" [attr.colspan]="_severitiesDisplayedColumns.length">Нет уровней серьёзности</td>
          </tr>
        </table>
      </div>
    </section>
  </div>
</app-dialog-wrapper>
