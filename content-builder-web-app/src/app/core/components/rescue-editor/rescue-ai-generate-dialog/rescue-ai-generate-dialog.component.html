<app-dialog-wrapper
  title="ИИ-генерация режима спасения"
  subtitle="Создание сценария неотложной помощи с развилками и параметрами"
  saveText="Сгенерировать сценарий"
  saveIcon="bolt"
  [saveDisabled]="_generating() || _prompt.invalid || _sceneCount.invalid"
  [loading]="_generating()"
  (save)="_generate()"
  (close)="_cancel()"
>
  <div class="relative flex flex-col gap-4 min-w-[min(100%,480px)]">
    <!-- Quick Starter Chips -->
    <div class="space-y-1.5">
      <div class="text-xs font-medium text-slate-500 dark:text-slate-400">
        Быстрые шаблоны ситуаций:
      </div>
      <div class="flex flex-wrap gap-1.5">
        @for (chip of _sampleChips; track chip) {
          <app-button
            variant="secondary"
            size="sm"
            (click)="_setPromptSample(chip)"
          >
            {{ chip }}
          </app-button>
        }
      </div>
    </div>

    <app-textarea
      label="Промпт-сценарий"
      [rows]="6"
      [formControl]="_prompt"
      placeholder="Например: ожог кипятком на кухне, параметры — боль и время до приезда скорой, развилки действий..."
    />

    <div class="grid grid-cols-2 gap-4">
      <app-input
        label="Количество сцен"
        type="number"
        [min]="1"
        [max]="15"
        badge="1–15"
        hint="Пусто — ИИ решит сам"
        [error]="_sceneCount.invalid ? 'Допустимо от 1 до 15' : null"
        [formControl]="_sceneCount"
      />
      <app-select
        label="Сложность сценария"
        [options]="_difficultyOptions"
        allowEmpty
        emptyLabel="Не указана"
        [formControl]="_difficulty"
      />
    </div>

    @if (_error(); as err) {
      <div class="flex items-center gap-2 p-3 rounded-xl bg-red-500/10 text-red-600 dark:text-red-400 text-xs border border-red-500/20">
        <mat-icon svgIcon="exclamation-circle" class="!w-4 !h-4 shrink-0" />
        <span>{{ err }}</span>
      </div>
    }

    @if (_generating()) {
      <div class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 rounded-xl bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm">
        <mat-spinner diameter="36" />
        <span class="text-xs font-medium text-slate-600 dark:text-slate-300 animate-pulse">Генерация сценария нейросетью…</span>
      </div>
    }
  </div>
</app-dialog-wrapper>
