<button
  type="button"
  mat-icon-button
  (click)="_handleToggle()"
  class="!w-9 !h-9 !rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors inline-flex items-center justify-center"
  [title]="_currentMode() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
>
  <mat-icon [svgIcon]="_currentMode() === 'dark' ? 'moon' : 'sun'" class="!w-4 !h-4" />
</button>
