# Urgent Care — HTTP front (start page + SPAs + API reverse proxy)
# Installed as: /etc/nginx/sites-available/urgent-care
# Does NOT use default_server (Supabase owns trouble-dent.ru on this host).

upstream urgent_care_api {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name 77.91.90.39;

    # Uncomment after certbot / when certs exist:
    # include /etc/nginx/snippets/urgent-care-ssl-redirect.conf;

    root /var/www/urgent-care;
    index index.html;

    client_max_body_size 50m;

    # API (FastAPI under /api/...)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_pass http://urgent_care_api;
    }

    location = /health {
        proxy_pass http://urgent_care_api/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://urgent_care_api/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://urgent_care_api/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://urgent_care_api/openapi.json;
        proxy_set_header Host $host;
    }

    location /content-builder/ {
        try_files $uri $uri/ /content-builder/index.html;
    }

    location /mobile-app/ {
        try_files $uri $uri/ /mobile-app/index.html;
    }

    # Start page
    # Kanban Planka (docker /opt/planka; BASE_URL=https://trouble-dent.ru/planka).
    # Держим в шаблоне: без этого деплой затирает ручной location на сервере.
    location = /planka {
        return 301 /planka/;
    }

    location /planka/socket.io/ {
        # polling — с префиксом, ws-upgrade — корневой путь (map в conf.d,
        # ставится setup-nginx.sh из deploy/nginx/planka-socket-upgrade.conf)
        proxy_pass $planka_socket_backend$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /planka/ {
        # Завершающий слэш срезает /planka: planka (latest) отдаёт статику только из корня,
        # хотя HTML генерирует ссылки вида /planka/assets/...
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
