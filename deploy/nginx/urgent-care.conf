# Urgent Care — HTTP front (start page + SPAs + API reverse proxy)
# Installed as: /etc/nginx/sites-available/urgent-care
# Does NOT use default_server (Supabase owns trouble-dent.ru on this host).

upstream urgent_care_api {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name 77.91.90.39;

    # Uncomment after certbot / when certs exist:
    # include /etc/nginx/snippets/urgent-care-ssl-redirect.conf;

    root /var/www/urgent-care;
    index index.html;

    client_max_body_size 50m;

    # API (FastAPI under /api/...)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_pass http://urgent_care_api;
    }

    location = /health {
        proxy_pass http://urgent_care_api/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://urgent_care_api/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://urgent_care_api/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://urgent_care_api/openapi.json;
        proxy_set_header Host $host;
    }

    location /content-builder/ {
        try_files $uri $uri/ /content-builder/index.html;
    }

    location /mobile-app/ {
        try_files $uri $uri/ /mobile-app/index.html;
    }

    # APK downloads (directory listing)
    location = /releases {
        return 301 /releases/;
    }

    # APK folder: use root (not alias) so index.html gets text/html
    location /releases/ {
        root /var/www/urgent-care;
        index index.html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location ~* ^/releases/.+\.apk$ {
        root /var/www/urgent-care;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
    }

    # Start page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
