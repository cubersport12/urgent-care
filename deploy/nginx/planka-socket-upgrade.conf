# Planka 2.2.1: polling отвечает на /planka/socket.io/ (из BASE_URL),
# а ws-upgrade принимается только корневым /socket.io/. Роутим по transport.
# Ставится в /etc/nginx/conf.d/ скриптом deploy/remote/setup-nginx.sh (bootstrap).
map $arg_transport $planka_socket_backend {
    websocket http://127.0.0.1:8091/socket.io/;
    default   http://127.0.0.1:8091/planka/socket.io/;
}
