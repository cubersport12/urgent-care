# - push to main/master (merge PR): automatically creates a new GitHub Release,
#   which triggers Deploy to VPS + Android APK build attached to the release.
# - GitHub Release published: runs Deploy to VPS + builds TroubleDent.apk and attaches it.
# - workflow_dispatch: manual run (with optional release creation).

name: Release

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a new GitHub release?'
        type: boolean
        default: false
      tag_name:
        description: 'Release tag (optional, e.g. v0.43)'
        required: false
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_URL: https://trouble-dent.ru
  EXPO_BASE_URL: /mobile-app
  DEPLOY_HOST: 77.91.90.39
  DEPLOY_PUBLIC_HOST: trouble-dent.ru
  DEPLOY_USER: root

jobs:
  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const inputTag = (process.env.INPUT_TAG || '').trim();
            if (inputTag) {
              console.log('Using provided tag:', inputTag);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag_name=' + inputTag + '\n');
              process.exit(0);
            }
            let tags = [];
            try {
              tags = execSync('git tag -l').toString().trim().split('\n').filter(Boolean);
            } catch (e) {
              tags = [];
            }
            let maxMajor = 0, maxMinor = 42, maxPatch = 0;
            for (const t of tags) {
              if (t.startsWith('android-')) continue;
              const m = t.match(/^v?[-_]?(\d+)[._-](\d+)(?:[._-](\d+))?/i) || t.match(/^(\d+)[-_](\d+)\.v$/i);
              if (m) {
                const major = parseInt(m[1], 10);
                const minor = parseInt(m[2], 10);
                const patch = m[3] ? parseInt(m[3], 10) : 0;
                if (major > maxMajor || (major === maxMajor && minor > maxMinor) || (major === maxMajor && minor === maxMinor && patch > maxPatch)) {
                  maxMajor = major;
                  maxMinor = minor;
                  maxPatch = patch;
                }
              }
            }
            let nextMinor = maxMinor + 1;
            let nextTag = 'v' + maxMajor + '.' + nextMinor;
            while (tags.includes(nextTag)) {
              nextMinor++;
              nextTag = 'v' + maxMajor + '.' + nextMinor;
            }
            console.log('Next release tag:', nextTag);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag_name=' + nextTag + '\n');
          "

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            --target "${{ github.sha }}" \
            --title "$TAG_NAME" \
            --generate-notes

  build-android:
    name: Build & publish APK
    needs: [create-release]
    if: |
      always() &&
      !cancelled() &&
      (
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.create-release.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || needs.create-release.outputs.tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Set app version from release tag
        if: github.event_name == 'release' || (needs.create-release.outputs.tag_name != '' && needs.create-release.outputs.tag_name != null)
        working-directory: mobile-app
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || needs.create-release.outputs.tag_name }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = String(process.env.RELEASE_TAG || '').replace(/^v[-_]?/i, '');
            if (!tag) process.exit(0);
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const app = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            pkg.version = tag;
            app.expo.version = tag.split('+')[0];
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('version set to', tag);
          "

      - name: Append build hash (manual dispatch)
        if: github.event_name != 'release' && (needs.create-release.outputs.tag_name == '' || needs.create-release.outputs.tag_name == null)
        working-directory: mobile-app
        run: |
          export BUILD_HASH="$(git rev-parse --short HEAD)"
          node -e "
            const fs = require('fs');
            const hash = process.env.BUILD_HASH;
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const app = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            const basePkg = String(pkg.version || '1.0.0').split('+')[0];
            const baseApp = String(app.expo?.version || '1.0.0').split('+')[0];
            pkg.version = basePkg + '+' + hash;
            app.expo.version = baseApp + '+' + hash;
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2) + '\n');
          "

      - name: Generate Android project (Expo prebuild)
        working-directory: mobile-app
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile-app/android/**/*.gradle*', 'mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: mobile-app
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: mobile-app
        run: cd android && ./gradlew assembleRelease

      - name: Prepare named APK
        run: |
          cp mobile-app/android/app/build/outputs/apk/release/app-release.apk \
             mobile-app/android/app/build/outputs/apk/release/TroubleDent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: mobile-app/android/app/build/outputs/apk/release/TroubleDent.apk
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || (needs.create-release.outputs.tag_name != '' && needs.create-release.outputs.tag_name != null)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || needs.create-release.outputs.tag_name }}
          files: mobile-app/android/app/build/outputs/apk/release/TroubleDent.apk
          overwrite_files: true

  deploy:
    name: Deploy to VPS
    needs: [create-release]
    if: |
      always() &&
      !cancelled() &&
      (
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.create-release.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || needs.create-release.outputs.tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            content-builder-web-app/package-lock.json
            mobile-app/package-lock.json

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Install landing deps
        working-directory: landing
        run: npm ci

      - name: Build landing
        working-directory: landing
        run: npm run build

      - name: Install content-builder deps
        working-directory: content-builder-web-app
        run: npm ci --legacy-peer-deps

      - name: Build content-builder (VPS)
        working-directory: content-builder-web-app
        env:
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
        run: npm run build:vps

      - name: Install mobile-app deps
        working-directory: mobile-app
        run: npm ci

      - name: Build mobile-app web (VPS)
        working-directory: mobile-app
        run: npm run web:build:vps

      - name: Deploy to VPS
        run: |
          export DEPLOY_SSH_KEY="$HOME/.ssh/deploy_key"
          export DEPLOY_HOST="${{ env.DEPLOY_HOST }}"
          export DEPLOY_USER="${{ env.DEPLOY_USER }}"
          export DEPLOY_PUBLIC_HOST="${{ env.DEPLOY_PUBLIC_HOST }}"
          chmod +x scripts/deploy.sh deploy/remote/*.sh deploy/enable-ssl.sh
          ./scripts/deploy.sh --skip-build
