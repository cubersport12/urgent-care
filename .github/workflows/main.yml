# GitHub Pages publish is manual-only.
# Production deploy + APK: see release.yml (triggered by GitHub Release).

name: GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_content_builder:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    name: Build & publish GitHub Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Start Page deps
        run: npm install --legacy-peer-deps
        working-directory: ./start-page

      - name: Build Start Page
        run: npm run build
        working-directory: ./start-page

      - name: Install Content Builder deps
        run: npm ci --legacy-peer-deps
        working-directory: ./content-builder-web-app

      - name: Build Content Builder
        run: npm run build
        working-directory: ./content-builder-web-app
        env:
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}

      - name: Install mobile app deps
        run: npm ci
        working-directory: ./mobile-app

      - name: Build mobile Web App (GH Pages path)
        run: npm run web:build
        working-directory: ./mobile-app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
