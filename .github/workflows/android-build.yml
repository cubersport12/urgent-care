# Deprecated: Android APK is built and attached by release.yml when a GitHub Release is published.
# Kept as a manual-only workflow for ad-hoc APK builds without a release.

name: Android Build (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: android-apk-build
      queue: max
    env:
      EXPO_PUBLIC_API_URL: https://trouble-dent.ru

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: ./mobile-app/package-lock.json
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile-app

      - name: Generate Android project (Expo prebuild)
        working-directory: ./mobile-app
        run: |
          # ponytail: The seconds-since-2020 code reaches Android's limit in 2086; choose a new scheme before then.
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const code = Math.floor(Date.now() / 1000) - 1577836800;
            if (code <= 0 || code > 2100000000) throw new Error('Android versionCode is out of range');
            app.expo.android.versionCode = code;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('Android versionCode:', code, '(seconds since 2020-01-01 UTC)');
          "
          npx expo prebuild --platform android --non-interactive --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew
        working-directory: mobile-app

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease
        working-directory: mobile-app

      - name: Prepare named APK artifact
        run: cp mobile-app/android/app/build/outputs/apk/release/app-release.apk mobile-app/android/app/build/outputs/apk/release/TroubleDent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: mobile-app/android/app/build/outputs/apk/release/TroubleDent.apk
          retention-days: 5
